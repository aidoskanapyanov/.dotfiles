[font]
size = 14.0 # Adjust this number to change your font size

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[selection]
save_to_clipboard = true

[keyboard]
bindings = [
    # Map Ctrl+V to paste normally
    { key = "V", mods = "Control", action = "Paste" },

    # The multi-action sequence for Ctrl+C
    { key = "C", mods = "Control", action = "Copy" },
    { key = "C", mods = "Control", action = "ClearSelection" },
    { key = "C", mods = "Control", action = "ReceiveChar" }
]

[window]
option_as_alt = "Both"

[terminal]
osc52 = "CopyPaste"

[colors.primary]
background = '#1a1b26'
foreground = '#c0caf5'

[colors.normal]
black = '#15161e'
red = '#f7768e'
green = '#9ece6a'
yellow = '#e0af68'
blue = '#7aa2f7'
magenta = '#bb9af7'
cyan = '#7dcfff'
white = '#a9b1d6'

[colors.bright]
black = '#414868'
red = '#f7768e'
green = '#9ece6a'
yellow = '#e0af68'
blue = '#7aa2f7'
magenta = '#bb9af7'
cyan = '#7dcfff'
white = '#c0caf5'


